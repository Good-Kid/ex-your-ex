<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>I got {{RESULT_TITLE}} - Take the Quiz!</title>

        <!-- Open Graph -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="{{ABS_SHARE_URL}}" />
        <meta
            property="og:title"
            content="I got {{RESULT_TITLE}}! - Paranormal Personality Quiz"
        />
        <meta property="og:description" content="{{OG_DESCRIPTION}}" />
        <meta property="og:image" content="{{OG_IMAGE_URL}}" />
        <meta property="og:image:width" content="{{OG_IMAGE_WIDTH}}" />
        <meta property="og:image:height" content="{{OG_IMAGE_HEIGHT}}" />

        <!-- Twitter -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta
            name="twitter:title"
            content="I got {{RESULT_TITLE}}! - Paranormal Personality Quiz"
        />
        <meta name="twitter:description" content="{{TW_DESCRIPTION}}" />
        <meta name="twitter:url" content="{{ABS_SHARE_URL}}" />
        <meta name="twitter:image" content="{{TW_IMAGE_URL}}" />

        <!-- GA4 script -->
        <script
            async
            src="https://www.googletagmanager.com/gtag/js?id={{GA_MEASUREMENT_ID}}"
        ></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag() {
                dataLayer.push(arguments);
            }
            gtag("js", new Date());
            gtag("config", "{{GA_MEASUREMENT_ID}}", { send_page_view: true });
        </script>

        <!-- Human redirect (bots ignored) -->
        <script>
            (function () {
                var ua = navigator.userAgent;
                var isBot =
                    /bot|crawl|spider|facebookexternalhit|Discordbot|Twitterbot|Slackbot/i.test(
                        ua
                    );
                if (!isBot) setTimeout(() => location.replace("/quiz"), 150);
            })();
        </script>
    </head>
    <body></body>
</html>
